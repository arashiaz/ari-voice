name: Android APK

on:
  push:
    branches:
      - arena/31de8a79-ari-voice
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check out pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8642541b255bfb5dc39cd351a178be09013a55d6
          path: vendor/llama.cpp
          submodules: recursive
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test and build debug APK
        run: |
          if ! ./gradlew --no-daemon testDebugUnitTest assembleDebug > build.log 2>&1; then
            tail -n 100 build.log
            python3 - <<'PY'
          from pathlib import Path
          tail = Path('build.log').read_text(errors='replace')[-7000:]
          tail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Android build failure::' + tail)
          PY
            exit 1
          fi
          tail -n 30 build.log
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AriVoice-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  emulator-smoke:
    # A full emulator is expensive; run only via the manual workflow_dispatch action.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check out pinned llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 8642541b255bfb5dc39cd351a178be09013a55d6
          path: vendor/llama.cpp
          submodules: recursive
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Build x86_64 test APK and run parser tests
        run: ./gradlew --no-daemon -PemulatorBuild=true testDebugUnitTest assembleDebug
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and check UI on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          script: python3 .github/scripts/emulator-smoke.py
